<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4168d7"><meta name="description" content="Dein persönlicher, lokal gespeicherter Vokabeltrainer">
<title>Voka – dein Vokabeltrainer</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--surface:#fff;--surface2:#e9edf7;--text:#172033;--muted:#5e687c;--line:#d9deea;--accent:#4168d7;--accent2:#dce6ff;--good:#16835d;--bad:#c34444;--shadow:0 5px 22px #26365c12;--radius:22px}
@media(prefers-color-scheme:dark){:root{--bg:#11141b;--surface:#1b202b;--surface2:#252d3b;--text:#edf1fb;--muted:#aab4c7;--line:#333d4f;--accent:#9db5ff;--accent2:#2a385c;--good:#64d7a5;--bad:#ff8989;--shadow:0 5px 22px #0003}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:15px;padding:11px 15px;background:var(--surface2);color:var(--text);font-weight:650}button.primary{background:var(--accent);color:white}button.danger{color:var(--bad)}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);padding:11px 12px;min-width:0}textarea{min-height:90px;resize:vertical}label{display:block;font-size:.9rem;color:var(--muted);margin:0 0 5px}.app{max-width:1000px;margin:auto;padding:0 14px 110px}.top{padding:22px 4px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:1.6rem;font-weight:850;letter-spacing:-.06em}.brand span{color:var(--accent)}.subtitle{color:var(--muted);font-size:.88rem}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin:12px 0}.hero{background:linear-gradient(130deg,var(--accent2),var(--surface));padding:23px}.hero h1{font-size:1.8rem;line-height:1.1;margin:4px 0 10px;letter-spacing:-.04em}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{padding:16px;border-radius:18px;background:var(--surface2)}.stat b{font-size:1.6rem;display:block}.stat span{color:var(--muted);font-size:.85rem}.section-title{font-size:1.2rem;font-weight:800;margin:18px 2px 8px}.stack{display:grid;gap:10px}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fieldgrid .wide{grid-column:1/-1}.pill{display:inline-flex;padding:5px 10px;border-radius:999px;background:var(--surface2);font-size:.82rem;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px;z-index:10}.nav button{flex:1;max-width:160px;padding:9px 3px;border-radius:14px;background:transparent;font-size:.76rem;font-weight:650;color:var(--muted)}.nav button.active{background:var(--accent2);color:var(--text)}.nav .ico{display:block;font-size:1.2rem;margin-bottom:2px}.listitem{border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}.listitem .grow{flex:1;min-width:0}.listitem strong{display:block;overflow-wrap:anywhere}.listitem small{color:var(--muted)}.empty{padding:25px;text-align:center;color:var(--muted)}.hidden{display:none!important}.answercard{min-height:200px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}.prompt{font-size:1.75rem;font-weight:800;overflow-wrap:anywhere}.feedback{padding:12px;border-radius:14px;background:var(--surface2)}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent);width:0}.small{font-size:.85rem}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.hr{border:0;border-top:1px solid var(--line);margin:16px 0}.notice{font-size:.86rem;background:var(--surface2);border-radius:14px;padding:12px;color:var(--muted)}.checkrow{display:flex;align-items:center;gap:10px;margin:10px 0}.checkrow input{width:auto}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:11px 16px;border-radius:999px;z-index:30;max-width:90vw;box-shadow:var(--shadow)}.tag{font-size:.75rem;padding:3px 8px;background:var(--accent2);border-radius:7px;display:inline-block;margin:2px}.wordmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}@media(min-width:700px){.app{padding-left:22px;padding-right:22px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{top:92px;bottom:auto;left:calc(50% - 500px);right:auto;width:150px;display:flex;flex-direction:column;border:0;background:transparent;padding:0}.nav button{max-width:none;text-align:left;display:flex;align-items:center;gap:10px;padding:12px}.nav .ico{margin:0}.app{padding-left:175px}.top{padding-top:28px}.hero h1{font-size:2.2rem}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">Voka<span>.</span></div><div class="subtitle">Dein Vokabeltrainer · lokal & privat</div></div><span class="pill" id="saveState">● lokal gespeichert</span></header>
<main id="view"></main>
</div>
<nav class="nav" aria-label="Hauptnavigation">
<button data-tab="home" class="active"><span class="ico">⌂</span>Start</button><button data-tab="words"><span class="ico">▤</span>Vokabeln</button><button data-tab="learn"><span class="ico">✦</span>Lernen</button><button data-tab="stats"><span class="ico">▥</span>Statistik</button><button data-tab="settings"><span class="ico">⚙</span>Einstellungen</button>
</nav><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const KEY='voka_local_v1';
const defaults=()=>({version:1,collections:[{id:id(),name:'Meine erste Sammlung',languageFrom:'Latein',languageTo:'Deutsch',settings:{pointsThreshold:5,roundMode:'flex',roundCount:20,dailyGoal:15,quizMode:'type',direction:'forward',sort:'manual',breakReminder:false,pomodoro:false,achievements:true,levels:true,rewards:false,statsMotivation:true},lists:[{id:id(),name:'Erste Vokabelliste',words:[]}]}],activeCollection:null,activeList:null,history:[],prefs:{theme:'device',fontSize:1,cardColor:'default',grammarChat:false}});
function id(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.collections))data=defaults();
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('saveState').textContent='● lokal gespeichert'}catch(e){document.getElementById('saveState').textContent='Speicherproblem';toast('Speichern fehlgeschlagen. Bitte exportiere eine Sicherung.')}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.classList.add('hidden'),2800)}
function allWords(){return data.collections.flatMap(c=>c.lists.flatMap(l=>l.words.map(w=>({...w,collectionId:c.id,listId:l.id,collectionName:c.name,listName:l.name}))))}
function getC(){return data.collections.find(c=>c.id===data.activeCollection)||data.collections[0]}
function getL(c=getC()){return c?.lists.find(l=>l.id===data.activeList)||c?.lists[0]}
function ensureActive(){let c=getC();if(c){data.activeCollection=c.id;let l=getL(c);if(l)data.activeList=l.id}save()}
ensureActive();
let tab='home',editWordId=null,quiz=null,grammarMessages=[];
const view=document.getElementById('view');
function btn(text,fn,cls=''){return `<button class="${cls}" data-action="${esc(fn)}">${text}</button>`}
function selectOptions(items,value){return items.map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home')home();if(tab==='words')wordsPage();if(tab==='learn')learnPage();if(tab==='stats')statsPage();if(tab==='settings')settingsPage()}
function home(){let words=allWords(),today=new Date().toDateString(),hist=data.history.filter(x=>new Date(x.at).toDateString()===today),correct=hist.filter(x=>x.correct).length,points=words.reduce((n,w)=>n+(w.points||0),0),c=getC(),l=getL();view.innerHTML=`<section class="panel hero"><div class="pill">DEIN LERNPLATZ</div><h1>Hallo! Bereit für ein paar Vokabeln?</h1><p class="muted">Deine Listen und Lernstände bleiben auf diesem Gerät gespeichert.</p><div class="actions">${btn('Jetzt lernen →',"goLearn",'primary')}${btn('Vokabel hinzufügen','newWord')}</div></section><div class="grid"><div class="stat"><b>${words.length}</b><span>Vokabeln insgesamt</span></div><div class="stat"><b>${correct}</b><span>Heute richtig</span></div><div class="stat"><b>${points}</b><span>Punkte gesamt</span></div><div class="stat"><b>${hist.length}</b><span>Antworten heute</span></div></div><div class="section-title">Deine Sammlungen</div><section class="panel"><div class="row between"><div><strong>${esc(c?.name||'Keine Sammlung')}</strong><div class="muted small">${esc(c?.languageFrom||'')} → ${esc(c?.languageTo||'')}</div></div>${btn('Wechseln','chooseCollection')}</div><hr class="hr"><div class="row between"><div><strong>${esc(l?.name||'Keine Liste')}</strong><div class="muted small">${l?.words.length||0} Vokabeln</div></div>${btn('Listen öffnen','goWords')}</div></section><div class="section-title">Schnellzugriff</div><div class="grid"><div class="panel"><strong>Importieren</strong><p class="muted small">CSV, Text oder eine Voka-Sicherung laden.</p>${btn('Datei/Text importieren','importData')}</div><div class="panel"><strong>Grammatik</strong><p class="muted small">Offline-Regeln und Beispiele nachschlagen.</p>${btn('Grammatik öffnen','grammar')}</div></div>`}
function wordsPage(){let c=getC(),l=getL(c);if(!c){view.innerHTML='<section class="panel">Erstelle zuerst eine Sammlung.</section>';return}let sort=c.settings.sort||'manual',arr=[...(l?.words||[])];if(sort==='alpha')arr.sort((a,b)=>a.term.localeCompare(b.term));if(sort==='translation')arr.sort((a,b)=>(a.translation||'').localeCompare(b.translation||''));view.innerHTML=`<div class="section-title">Vokabeln</div><section class="panel"><div class="fieldgrid"><div><label>Sammlung</label><select id="pickCollection">${data.collections.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label>Vokabelliste</label><select id="pickList">${c.lists.map(x=>`<option value="${x.id}" ${x.id===l?.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div></div><div class="actions" style="margin-top:12px">${btn('+ Sammlung','newCollection')}${btn('+ Liste','newList')}${btn('+ Vokabel','newWord','primary')}</div><hr class="hr"><div class="fieldgrid"><div><label>Sortierung</label><select id="sortPick">${selectOptions([['manual','Manuell'],['alpha','Alphabetisch nach Vokabel'],['translation','Alphabetisch nach Übersetzung']],sort)}</select></div><div><label>Suche</label><input id="wordSearch" placeholder="Vokabel suchen …"></div></div></section><div id="wordList" class="stack">${arr.length?arr.map(w=>wordCard(w)).join(''):'<div class="panel empty">Hier ist noch Platz für deine Vokabeln. Tippe auf „+ Vokabel“ oder importiere eine Liste.</div>'}</div><section class="panel"><strong>Import und Sicherung</strong><p class="muted small">Text/CSV importieren oder eine vollständige JSON-Sicherung wiederherstellen.</p><div class="actions">${btn('Text/CSV importieren','importData')}${btn('Sicherung exportieren','exportData')}</div></section>`}
function wordCard(w){return `<article class="listitem word-card" data-search="${esc((w.term+' '+w.translation+' '+(w.tags||[]).join(' ')).toLowerCase())}"><div class="grow"><strong>${esc(w.term)}</strong><div>${esc((w.translations||[w.translation]).filter(Boolean).join(' · '))}</div><div class="wordmeta">${w.gender?`<span class="tag">${esc(w.gender)}</span>`:''}${w.partOfSpeech?`<span class="tag">${esc(w.partOfSpeech)}</span>`:''}${w.points!==undefined?`<span class="tag">${w.points} Punkte</span>`:''}${(w.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><div class="stack">${btn('Bearbeiten',`edit:${w.id}`)}${btn('•••',`more:${w.id}`)}</div></article>`}
function wordForm(w=null){editWordId=w?.id||null;let c=getC(),l=getL(c);view.innerHTML=`<div class="section-title">${w?'Vokabel bearbeiten':'Neue Vokabel'}</div><form id="wordForm" class="panel"><div class="fieldgrid"><div><label>Vokabel / Grundform *</label><input name="term" required value="${esc(w?.term||'')}" placeholder="z. B. puella"></div><div><label>Hauptübersetzung *</label><input name="translation" required value="${esc(w?.translation||'')}" placeholder="z. B. Mädchen"></div><div class="wide"><label>Weitere akzeptierte Übersetzungen (mit ; trennen)</label><input name="translations" value="${esc((w?.translations||[]).filter(x=>x!==w?.translation).join('; '))}" placeholder="z. B. junge Frau; Maid"></div><div><label>Sprache des Wortes</label><input name="language" value="${esc(w?.language||c.languageFrom||'')}" placeholder="Latein"></div><div><label>Wortart</label><input name="partOfSpeech" value="${esc(w?.partOfSpeech||'')}" placeholder="Substantiv, Verb …"></div><div><label>Genus</label><input name="gender" value="${esc(w?.gender||'')}" placeholder="z. B. femininum"></div><div><label>Genitiv / wichtige Form</label><input name="genitive" value="${esc(w?.genitive||'')}" placeholder="z. B. puellae"></div><div><label>Deklination / Konjugation</label><input name="grammarForm" value="${esc(w?.grammarForm||'')}" placeholder="z. B. a-Deklination"></div><div><label>Weitere Wortformen</label><input name="forms" value="${esc(w?.forms||'')}" placeholder="z. B. go; went; gone"></div><div><label>Tags (mit Komma trennen)</label><input name="tags" value="${esc((w?.tags||[]).join(', '))}" placeholder="Schule, Kapitel 3"></div><div class="wide"><label>Beispielsätze</label><textarea name="examples" placeholder="Beispielsatz(e)">${esc(w?.examples||'')}</textarea></div><div class="wide"><label>Notizen / Erklärung</label><textarea name="notes" placeholder="Zusätzliche Hinweise">${esc(w?.notes||'')}</textarea></div><div class="wide"><label>Eigene Felder (je Zeile: Feldname = Wert)</label><textarea name="custom" placeholder="z. B. Stamm = puell-&#10;Merksatz = …">${esc(Object.entries(w?.custom||{}).map(([k,v])=>`${k} = ${v}`).join('\n'))}</textarea></div></div><hr class="hr"><div class="actions"><button class="primary" type="submit">Speichern</button><button type="button" data-action="goWords">Abbrechen</button>${w?`<button type="button" class="danger" data-action="delete:${w.id}">Löschen</button>`:''}</div></form>`;document.getElementById('wordForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),translations=String(f.get('translations')||'').split(';').map(s=>s.trim()).filter(Boolean),custom={};String(f.get('custom')||'').split('\n').forEach(line=>{let i=line.indexOf('=');if(i>0)custom[line.slice(0,i).trim()]=line.slice(i+1).trim()});let obj={id:w?.id||id(),term:String(f.get('term')).trim(),translation:String(f.get('translation')).trim(),translations:[String(f.get('translation')).trim(),...translations],language:String(f.get('language')||''),partOfSpeech:String(f.get('partOfSpeech')||''),gender:String(f.get('gender')||''),genitive:String(f.get('genitive')||''),grammarForm:String(f.get('grammarForm')||''),forms:String(f.get('forms')||''),tags:String(f.get('tags')||'').split(',').map(s=>s.trim()).filter(Boolean),examples:String(f.get('examples')||''),notes:String(f.get('notes')||''),custom,points:w?.points??0,wrong:w?.wrong??0,correct:w?.correct??0,mastered:w?.mastered??false};let words=l.words,idx=words.findIndex(x=>x.id===obj.id);if(idx>=0)words[idx]=obj;else words.push(obj);save();toast('Vokabel gespeichert');tab='words';render()}}
function learnPage(){let c=getC(),l=getL(c);if(quiz){renderQuiz();return}view.innerHTML=`<div class="section-title">Lernen</div><section class="panel"><p class="muted">Stelle dir deine Runde passend zusammen.</p><div class="fieldgrid"><div><label>Sammlung</label><select id="quizCollection">${data.collections.map(x=>`<option value="${x.id}" ${x.id===c?.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label>Vokabelliste</label><select id="quizList"><option value="all">Alle Listen dieser Sammlung</option>${(c?.lists||[]).map(x=>`<option value="${x.id}" ${x.id===l?.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label>Abfragerichtung</label><select id="quizDirection">${selectOptions([['forward',`${c?.languageFrom||'Sprache A'} → ${c?.languageTo||'Sprache B'}`],['reverse',`${c?.languageTo||'Sprache B'} → ${c?.languageFrom||'Sprache A'}`]],c?.settings.direction||'forward')}</select></div><div><label>Abfragemodus</label><select id="quizMode">${selectOptions([['type','Antwort eintippen'],['flash','Karteikarten'],['choice','Multiple Choice']],c?.settings.quizMode||'type')}</select></div><div><label>Rundenart</label><select id="quizRound">${selectOptions([['fixed','Feste Anzahl'],['flex','Offen lernen']],c?.settings.roundMode||'flex')}</select></div><div id="roundCountWrap"><label>Anzahl Vokabeln</label><input id="roundCount" type="number" min="1" max="500" value="${c?.settings.roundCount||20}"></div></div><label class="checkrow"><input type="checkbox" id="mixLists"> Ausgewählte Listen gemeinsam lernen</label><div class="notice">Schwierige Vokabeln werden häufiger abgefragt. Unter deiner eingestellten Punktgrenze werden alle Vokabeln gleich behandelt.</div><div style="margin-top:14px">${btn('Lernrunde starten','startQuiz','primary')}</div></section><section class="panel"><strong>Grammatik-Hilfe</strong><p class="muted small">Offline-Regeln, Beispiele und eine einfache Hilfesuche findest du im Grammatikbereich.</p>${btn('Grammatik öffnen','grammar')}</section>`;document.getElementById('quizRound').onchange=e=>document.getElementById('roundCountWrap').classList.toggle('hidden',e.target.value!=='fixed')}
function renderQuiz(){let q=quiz;if(!q){learnPage();return}let w=q.words[q.index];if(!w){finishQuiz();return}let prompt=q.direction==='forward'?w.term:(w.translations||[w.translation]).join(' / '),answer=q.direction==='forward'?(w.translations||[w.translation]).join(' / '):w.term;let mode=q.mode;view.innerHTML=`<div class="row between"><div><div class="section-title" style="margin-top:0">Lernrunde</div><div class="muted small">${q.index+1}${q.limit?` / ${q.limit}`:''} · ${q.correct} richtig</div></div>${btn('Beenden','finishQuiz')}</div><div class="bar"><span style="width:${q.limit?Math.min(100,q.index/q.limit*100):0}%"></span></div><section class="panel answercard"><div class="pill">${esc(w.partOfSpeech||w.language||'VOKABEL')}</div><div class="prompt">${esc(prompt)}</div>${w.grammarForm?`<div class="muted small">${esc(w.grammarForm)}</div>`:''}${mode==='flash'?`<div id="flashAnswer" class="hidden feedback"><strong>${esc(answer)}</strong><div class="small">${esc(w.notes||'')}</div></div><button class="primary" data-action="reveal">Antwort anzeigen</button><div id="flashRate" class="actions hidden"><button data-action="gradeGood">Gewusst ✓</button><button data-action="gradeBad" class="danger">Nicht gewusst ✕</button></div>`:mode==='choice'?choiceUI(w,q.direction):`<form id="answerForm"><label for="answerInput">Deine Antwort</label><input id="answerInput" autocomplete="off" autocapitalize="off" required placeholder="Antwort eingeben …"><div style="margin-top:12px"><button class="primary" type="submit">Prüfen</button></div></form><div id="answerFeedback"></div>`}</section><div class="row between"><span class="pill">Punkte: ${w.points||0}</span><span class="pill">Schwierigkeit: ${w.wrong||0} Fehler</span></div>`;if(mode==='type'){let f=document.getElementById('answerForm');f.onsubmit=e=>{e.preventDefault();checkAnswer(document.getElementById('answerInput').value,w,q.direction)}}}
function choiceUI(w,direction){let correct=direction==='forward'?(w.translations||[w.translation])[0]:w.term;let options=[correct,...allWords().filter(x=>x.id!==w.id).map(x=>direction==='forward'?(x.translations||[x.translation])[0]:x.term)].filter(Boolean);options=[...new Set(options)].sort(()=>Math.random()-.5).slice(0,4);if(!options.includes(correct))options[0]=correct;options.sort(()=>Math.random()-.5);return `<div class="stack">${options.map(o=>`<button data-action="choice:${encodeURIComponent(o)}:${w.id}">${esc(o)}</button>`).join('')}</div><div id="choiceFeedback"></div>`}
function checkAnswer(value,w,direction){let expected=direction==='forward'?(w.translations||[w.translation]):[w.term];let norm=s=>String(s||'').trim().toLocaleLowerCase().replace(/[.!?;:,]/g,'').replace(/\s+/g,' ');let ok=expected.some(x=>norm(x)===norm(value));let box=document.getElementById('answerFeedback');if(!box)return;let attempt=Number(box.dataset.attempt||1);box.dataset.word=w.id;box.dataset.direction=direction;if(ok){applyGrade(w,true);quiz.correct++;delete w._pendingWrong;box.innerHTML=`<div class="feedback good">Richtig! +1 Punkt</div><button class="primary" data-action="nextQuestion" style="margin-top:10px">Weiter</button>`;box.dataset.done='yes'}else if(attempt===1){box.dataset.done='no';box.dataset.first=value;box.innerHTML=`<div class="feedback bad">Noch nicht ganz. Du hast einen zweiten Versuch.</div><button data-action="retryQuestion" style="margin-top:10px">Noch einmal versuchen</button>`;w._pendingWrong=true;save()}else{if(w._pendingWrong){applyGrade(w,false);delete w._pendingWrong}let answer=expected.join(' / ');box.innerHTML=`<div class="feedback bad">Die richtige Antwort ist: <strong>${esc(answer)}</strong>${w.notes?`<p>${esc(w.notes)}</p>`:''}</div><button class="primary" data-action="nextQuestion" style="margin-top:10px">Weiter</button>`;box.dataset.done='yes'}}
function applyGrade(w,ok){w.points=Math.max(0,(w.points||0)+(ok?1:-1));if(ok)w.correct=(w.correct||0)+1;else w.wrong=(w.wrong||0)+1;data.history.push({at:new Date().toISOString(),wordId:w.id,correct:ok});save()}
function answerWrongRetry(){let box=document.getElementById('answerFeedback'),input=document.getElementById('answerInput');if(!box||!input)return;box.dataset.attempt='2';box.innerHTML='';input.value='';input.focus()}
function advance(){if(quiz){quiz.index++;if(quiz.index>=quiz.words.length){finishQuiz();return}renderQuiz()}}
function finishQuiz(){if(quiz){let n=quiz.correct;quiz=null;view.innerHTML=`<section class="panel hero"><h1>Runde geschafft!</h1><p>Du hast ${n} Antwort(en) richtig beantwortet.</p>${btn('Zur Lernübersicht','goLearn','primary')}${btn('Noch eine Runde','startQuiz')}</section>`}}
function statsPage(){let words=allWords(),h=data.history,today=new Date().toDateString(),tod=h.filter(x=>new Date(x.at).toDateString()===today),correct=tod.filter(x=>x.correct).length,weak=[...words].sort((a,b)=>(b.wrong||0)-(a.wrong||0)).slice(0,8);view.innerHTML=`<div class="section-title">Dein Fortschritt</div><div class="grid"><div class="stat"><b>${words.length}</b><span>Vokabeln</span></div><div class="stat"><b>${h.filter(x=>x.correct).length}</b><span>Richtige Antworten gesamt</span></div><div class="stat"><b>${h.length}</b><span>Antworten gesamt</span></div><div class="stat"><b>${correct}/${tod.length||0}</b><span>Heute richtig</span></div></div><section class="panel"><strong>Fortschritt pro Sammlung</strong>${data.collections.map(c=>{let n=c.lists.reduce((a,l)=>a+l.words.length,0),m=c.lists.reduce((a,l)=>a+l.words.filter(w=>w.mastered).length,0);return `<div style="margin-top:14px"><div class="row between"><span>${esc(c.name)}</span><span class="muted small">${m}/${n} als gelernt markiert</span></div><div class="bar"><span style="width:${n?m/n*100:0}%"></span></div></div>`}).join('')}</section><section class="panel"><strong>Vokabeln, die noch Übung brauchen</strong>${weak.length?weak.map(w=>`<div class="listitem" style="margin-top:9px"><div class="grow"><strong>${esc(w.term)}</strong><small>${esc(w.translation)} · ${w.wrong||0} Fehler</small></div>${btn('Üben',`practice:${w.id}`)}</div>`).join(''):'<p class="muted">Noch keine Vokabeln. Füge welche hinzu und starte eine Runde.</p>'}</section><section class="panel"><strong>Tagesziel</strong><p class="muted small">Heute ${tod.length} Antworten · Ziel: ${getC()?.settings.dailyGoal||15}</p><div class="bar"><span style="width:${Math.min(100,tod.length/(getC()?.settings.dailyGoal||15)*100)}%"></span></div></section>`}
function settingsPage(){let c=getC();if(!c){view.innerHTML='Keine Sammlung vorhanden.';return}let s=c.settings;view.innerHTML=`<div class="section-title">Einstellungen</div><section class="panel"><h3>Sammlung & Sprachen</h3><div class="fieldgrid"><div><label>Name der Sammlung</label><input id="setName" value="${esc(c.name)}"></div><div><label>Sprache der Vokabeln</label><input id="setFrom" value="${esc(c.languageFrom)}"></div><div><label>Sprache der Antwort</label><input id="setTo" value="${esc(c.languageTo)}"></div><div><label>Standardsortierung</label><select id="setSort">${selectOptions([['manual','Manuell'],['alpha','Alphabetisch'],['translation','Nach Übersetzung']],s.sort||'manual')}</select></div></div><h3>Punkte & Wiederholung</h3><div class="fieldgrid"><div><label>Punktgrenze für gleichmäßige Abfrage</label><input id="setThreshold" type="number" min="0" max="10000" value="${s.pointsThreshold??5}"></div><div><label>Vokabeln pro Runde (Standard)</label><input id="setCount" type="number" min="1" max="500" value="${s.roundCount||20}"></div><div><label>Tagesziel (Antworten)</label><input id="setGoal" type="number" min="1" max="1000" value="${s.dailyGoal||15}"></div></div><p class="muted small">Unterhalb der Punktgrenze werden alle Vokabeln gleich häufig ausgewählt. Darüber haben schwierigere Wörter Vorrang; sicher beherrschte Wörter werden seltener gefragt.</p><h3>Motivation</h3>${check('achievements','Abzeichen / Erfolge',s.achievements)}${check('levels','Level',s.levels)}${check('rewards','Eigene Belohnungen',s.rewards)}${check('statsMotivation','Statistiken als Motivation',s.statsMotivation)}<h3>Lernpausen</h3>${check('breakReminder','Pausenerinnerung (Hinweis nach 25 Minuten)',s.breakReminder)}${check('pomodoro','Pomodoro-Modus (25 Minuten lernen / 5 Minuten Pause)',s.pomodoro)}<div class="actions" style="margin-top:14px">${btn('Einstellungen speichern','saveSettings','primary')}</div></section><section class="panel"><h3>Design</h3><p class="muted small">Das Farbschema folgt standardmäßig den Anzeigeeinstellungen deines Geräts.</p><div class="fieldgrid"><div><label>Farbschema</label><select id="prefTheme">${selectOptions([['device','Wie das Gerät'],['light','Hell'],['dark','Dunkel']],data.prefs.theme||'device')}</select></div><div><label>Schriftgröße</label><select id="prefFont">${selectOptions([['0.9','Klein'],['1','Normal'],['1.15','Groß'],['1.3','Sehr groß']],String(data.prefs.fontSize||1))}</select></div></div>${btn('Design speichern','saveDesign','primary')}</section><section class="panel"><h3>Daten & Privatsphäre</h3><p class="muted small">Alle Vokabeln und Lernstände bleiben in diesem Browser auf diesem Gerät. Es gibt kein Konto und keine Cloud-Synchronisierung. Website-Daten löschen kann die gespeicherten Daten entfernen.</p><div class="actions">${btn('Sicherung exportieren','exportData')}${btn('Sicherung importieren','importData')}${btn('Alle Daten löschen','wipeData','danger')}</div><hr class="hr"><h3>Grammatik-Hilfe</h3><p class="muted small">Die Grammatikregeln funktionieren offline. Die eingebaute Stichwort-Hilfe ist kein vollwertiges KI-Sprachmodell.</p>${btn('Grammatik öffnen','grammar')}</section>`}
function check(name,label,value){return `<label class="checkrow"><input type="checkbox" id="set_${name}" ${value?'checked':''}> ${label}</label>`}
function grammarPage(){tab='grammar';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));view.innerHTML=`<div class="section-title">Offline-Grammatik</div><section class="panel"><p class="muted">Suche nach einem Thema oder stelle eine kurze Frage. Diese Version verwendet ein lokales Nachschlagewerk mit einfachen Stichwort-Antworten, keine echte generative KI.</p><input id="grammarSearch" placeholder="z. B. lateinischer Genitiv, englisches Present Perfect …"><div class="actions" style="margin-top:10px">${btn('Suchen','grammarSearch')}</div><div id="grammarResult" class="stack" style="margin-top:14px"></div></section><section class="panel"><h3>Regeln zum Nachschlagen</h3><div class="stack">${grammarCard('Latein: a-Deklination','Typische Formen: puella, puellae, puellae, puellam, puella. Der Genitiv Singular endet häufig auf -ae. Es gibt Ausnahmen und Besonderheiten.','puella')} ${grammarCard('Englisch: Simple Past','Für regelmäßige Verben wird meist -ed angehängt (play → played). Unregelmäßige Verben haben eigene Formen (go → went).','simple past')} ${grammarCard('Englisch: Present Perfect','Bildung: have/has + past participle. Beispiel: I have finished. Die genaue Verwendung hängt vom Kontext ab.','present perfect')} ${grammarCard('Französisch: Artikel und Genus','Substantive haben ein grammatisches Geschlecht. Le/la/l’ stehen im Singular; les im Plural. Lerne neue Substantive möglichst mit Artikel.','französisch genus')} ${grammarCard('Spanisch: Adjektive','Adjektive stimmen häufig in Genus und Zahl mit dem Substantiv überein: chico alto, chica alta, chicos altos.','spanisch adjektive')}</div></section><section class="panel"><h3>Einfacher Offline-Hilfsdialog</h3><div id="chatMessages" class="stack"></div><form id="grammarChatForm" class="stack"><label>Deine Grammatikfrage</label><textarea id="chatInput" placeholder="Was möchtest du verstehen?" required></textarea><button class="primary">Frage stellen</button></form></section>`;document.getElementById('grammarSearch').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();doGrammarSearch()}};document.getElementById('grammarChatForm').onsubmit=e=>{e.preventDefault();let q=document.getElementById('chatInput').value.trim();if(!q)return;grammarMessages.push({q,a:grammarAnswer(q)});document.getElementById('chatInput').value='';drawChat()};drawChat()}
function grammarCard(title,body,tag){return `<details class="listitem"><summary><strong>${title}</strong></summary><p>${body}</p><span class="tag">${tag}</span></details>`}
function grammarAnswer(q){let s=q.toLowerCase();if(s.includes('genitiv')||s.includes('deklination')||s.includes('puella'))return 'Beim lateinischen Genitiv zeigt die Endung oft Zugehörigkeit oder ein Verhältnis an. Bei der a-Deklination lautet der Genitiv Singular häufig -ae, zum Beispiel puella → puellae. Achte immer auf Kasus, Numerus und Deklination.';if(s.includes('perfect')||s.includes('have')||s.includes('has'))return 'Das englische Present Perfect wird mit have/has + past participle gebildet: “I have finished”, “She has gone”. Für die passende Zeitform ist der Kontext entscheidend.';if(s.includes('past')||s.includes('went')||s.includes('simple'))return 'Im Simple Past stehen abgeschlossene Handlungen in der Vergangenheit. Regelmäßige Verben bekommen meist -ed; unregelmäßige Verben musst du in ihrer Vergangenheitsform lernen, zum Beispiel go → went.';if(s.includes('genus')||s.includes('artikel')||s.includes('französ'))return 'Im Französischen ist das grammatische Geschlecht Teil des Substantivs. Lerne Wörter am besten direkt mit Artikel: le livre, la maison. Vor Vokal oder stummem h wird häufig l’ verwendet.';if(s.includes('spanisch')||s.includes('adjektiv'))return 'Im Spanischen passen sich viele Adjektive an Genus und Zahl des Substantivs an: chico alto, chica alta, chicos altos. Es gibt auch unregelmäßige Formen und Ausnahmen.';return 'Zu dieser Frage habe ich in meinem kleinen Offline-Nachschlagewerk noch keine passende Regel. Versuche es mit einem konkreten Begriff (z. B. Genitiv, Deklination, Simple Past oder Present Perfect). Für freie, ausführliche Antworten bräuchte die App später ein zusätzliches Sprachmodell auf dem Gerät.'}
function doGrammarSearch(){let q=document.getElementById('grammarSearch').value;document.getElementById('grammarResult').innerHTML=`<div class="feedback">${esc(grammarAnswer(q))}</div>`}
function drawChat(){let el=document.getElementById('chatMessages');if(el)el.innerHTML=grammarMessages.map(m=>`<div class="feedback"><strong>Du:</strong> ${esc(m.q)}<hr class="hr"><strong>Voka:</strong> ${esc(m.a)}</div>`).join('')}
function importPage(){view.innerHTML=`<div class="section-title">Vokabeln importieren</div><section class="panel"><p class="muted">Du kannst einfachen Text, CSV oder eine zuvor exportierte Voka-JSON-Sicherung importieren. Für Tabellen aus Excel speichere sie zuerst als CSV. PDF-, Word-, Foto-/OCR-Import ist in dieser ersten Version noch nicht enthalten.</p><label>Ziel-Sammlung</label><select id="importCollection">${data.collections.map(c=>`<option value="${c.id}" ${c.id===getC()?.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label style="margin-top:12px">Ziel-Liste</label><select id="importList"><option value="new">Neue Liste erstellen</option>${getC().lists.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select><label style="margin-top:12px">Datei auswählen (CSV oder JSON)</label><input type="file" id="importFile" accept=".csv,.txt,.json,text/csv,text/plain,application/json"><label style="margin-top:12px">Oder Text einfügen</label><textarea id="importText" placeholder="Eine Vokabel pro Zeile, z. B. puella; Mädchen; puellae"></textarea><p class="muted small">CSV/Text: Standardformat pro Zeile <code>Vokabel;Übersetzung;Genitiv;Genus;Wortart</code>. Trennzeichen Komma oder Semikolon. Erste Zeile kann eine Kopfzeile sein.</p><div class="actions">${btn('Importieren','doImport','primary')}${btn('Abbrechen','goWords')}</div></section>`}
function parseDelimited(text){let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];let sep=(lines[0].split(';').length>1)?';':',';let rows=lines.map(line=>{let out=[],cur='',quote=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++}else quote=!quote}else if(ch===sep&&!quote){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out});if(/^(vokabel|term|word|latein|englisch)$/i.test(rows[0][0]||''))rows.shift();return rows.filter(r=>r[0])}
function doImport(){let c=data.collections.find(c=>c.id===document.getElementById('importCollection').value)||getC(),target=document.getElementById('importList').value,txt=document.getElementById('importText').value,file=document.getElementById('importFile').files[0];let read=async()=>{if(file){txt=await file.text();if(file.name.toLowerCase().endsWith('.json')){let obj=JSON.parse(txt);if(!obj.collections)throw Error('Das ist keine Voka-Sicherung.');if(!confirm('Die Sicherung ersetzt die aktuell geladenen Daten. Vorher am besten exportieren. Fortfahren?'))return;data=obj;ensureActive();toast('Sicherung wiederhergestellt');tab='home';render();return}}let rows=parseDelimited(txt);if(!rows.length){toast('Keine Vokabelzeilen gefunden.');return}let l;if(target==='new'){l={id:id(),name:'Import '+new Date().toLocaleDateString('de-DE'),words:[]};c.lists.push(l)}else l=c.lists.find(x=>x.id===target)||c.lists[0];rows.forEach(r=>{let term=r[0],translation=r[1]||'',genitive=r[2]||'',gender=r[3]||'',partOfSpeech=r[4]||'';l.words.push({id:id(),term,translation,translations:[translation],genitive,gender,partOfSpeech,language:c.languageFrom,grammarForm:'',forms:'',tags:[],examples:'',notes:'',custom:{},points:0,wrong:0,correct:0,mastered:false})});data.activeCollection=c.id;data.activeList=l.id;save();toast(`${rows.length} Vokabeln importiert`);tab='words';render()};read().catch(e=>toast('Importfehler: '+e.message))}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='voka-sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Sicherung wird exportiert')}
function newCollection(){let name=prompt('Name der neuen Sammlung?');if(!name?.trim())return;let c={id:id(),name:name.trim(),languageFrom:'Englisch',languageTo:'Deutsch',settings:{pointsThreshold:5,roundMode:'flex',roundCount:20,dailyGoal:15,quizMode:'type',direction:'forward',sort:'manual',breakReminder:false,pomodoro:false,achievements:true,levels:true,rewards:false,statsMotivation:true},lists:[{id:id(),name:'Neue Vokabelliste',words:[]}]};data.collections.push(c);data.activeCollection=c.id;data.activeList=c.lists[0].id;save();tab='words';render()}
function newList(){let c=getC(),name=prompt('Name der neuen Vokabelliste?');if(!name?.trim())return;let l={id:id(),name:name.trim(),words:[]};c.lists.push(l);data.activeList=l.id;save();render()}
function chooseCollection(){let names=data.collections.map((c,i)=>`${i+1}. ${c.name}`).join('\n'),n=prompt('Sammlung auswählen – Nummer eingeben:\n'+names,'1');if(n===null)return;let c=data.collections[Number(n)-1];if(c){data.activeCollection=c.id;data.activeList=c.lists[0]?.id;save();render()}}
function startQuiz(){let c=data.collections.find(c=>c.id===(document.getElementById('quizCollection')?.value||getC().id))||getC(),listId=document.getElementById('quizList')?.value||'all',mode=document.getElementById('quizMode')?.value||c.settings.quizMode||'type',direction=document.getElementById('quizDirection')?.value||'forward',round=document.getElementById('quizRound')?.value||'flex',limit=round==='fixed'?Math.max(1,Number(document.getElementById('roundCount')?.value||c.settings.roundCount||20)):0;let pool=c.lists.filter(l=>listId==='all'||l.id===listId).flatMap(l=>l.words.map(w=>({w,l})));if(!pool.length){toast('Diese Liste hat noch keine Vokabeln.');return}let threshold=Number(c.settings.pointsThreshold??5),below=pool.some(x=>(x.w.points||0)<threshold);if(!below){pool.sort((a,b)=>((b.w.wrong||0)-(a.w.wrong||0)) || (Math.random()-.5));}else pool.sort(()=>Math.random()-.5);let arr=pool.map(x=>x.w);if(limit)arr=arr.slice(0,Math.min(limit,arr.length));quiz={words:arr,index:0,correct:0,limit:limit||null,mode,direction};tab='learn';renderQuiz()}
function saveSettings(){let c=getC(),s=c.settings;c.name=document.getElementById('setName').value.trim()||c.name;c.languageFrom=document.getElementById('setFrom').value.trim()||'Sprache A';c.languageTo=document.getElementById('setTo').value.trim()||'Sprache B';s.sort=document.getElementById('setSort').value;s.pointsThreshold=Math.max(0,Number(document.getElementById('setThreshold').value||0));s.roundCount=Math.max(1,Number(document.getElementById('setCount').value||20));s.dailyGoal=Math.max(1,Number(document.getElementById('setGoal').value||15));['achievements','levels','rewards','statsMotivation','breakReminder','pomodoro'].forEach(k=>s[k]=document.getElementById('set_'+k).checked);save();toast('Einstellungen gespeichert');render()}
function saveDesign(){data.prefs.theme=document.getElementById('prefTheme').value;data.prefs.fontSize=Number(document.getElementById('prefFont').value);if(data.prefs.theme==='dark')document.documentElement.style.colorScheme='dark';else if(data.prefs.theme==='light')document.documentElement.style.colorScheme='light';else document.documentElement.style.colorScheme='light dark';document.body.style.fontSize=(16*data.prefs.fontSize)+'px';save();toast('Design gespeichert')}
function wipeData(){if(confirm('Wirklich alle Vokabeln, Sammlungen und Lernstände auf diesem Gerät löschen? Exportiere vorher eine Sicherung, wenn du etwas behalten möchtest.')){localStorage.removeItem(KEY);data=defaults();ensureActive();quiz=null;toast('Lokale Daten gelöscht');tab='home';render()}}
function nextQuestion(){advance()}
function handleAction(a){
 if(a==='goLearn'){tab='learn';quiz=null;render()}
 else if(a==='goWords'){tab='words';render()}
 else if(a==='newWord')wordForm()
 else if(a==='newCollection')newCollection()
 else if(a==='newList')newList()
 else if(a==='chooseCollection')chooseCollection()
 else if(a==='importData')importPage()
 else if(a==='exportData')exportData()
 else if(a==='doImport')doImport()
 else if(a==='saveSettings')saveSettings()
 else if(a==='saveDesign')saveDesign()
 else if(a==='wipeData')wipeData()
 else if(a==='startQuiz')startQuiz()
 else if(a==='finishQuiz')finishQuiz()
 else if(a==='grammar')grammarPage()
 else if(a==='grammarSearch')doGrammarSearch()
 else if(a==='reveal'){document.getElementById('flashAnswer')?.classList.remove('hidden');document.getElementById('flashRate')?.classList.remove('hidden');document.querySelector('[data-action="reveal"]')?.classList.add('hidden')}
 else if(a==='gradeGood'||a==='gradeBad'){let w=quiz.words[quiz.index];applyGrade(w,a==='gradeGood');if(a==='gradeGood')quiz.correct++;advance()}
 else if(a==='nextQuestion')nextQuestion()
 else if(a==='retryQuestion')answerWrongRetry()
 else if(a.startsWith('edit:')){let wid=a.slice(5),w=allWords().find(x=>x.id===wid);if(w){data.activeCollection=w.collectionId;data.activeList=w.listId;wordForm(w)}}
 else if(a.startsWith('delete:')){let wid=a.slice(7);if(confirm('Diese Vokabel wirklich löschen?')){for(let c of data.collections)for(let l of c.lists)l.words=l.words.filter(w=>w.id!==wid);save();tab='words';render()}}
 else if(a.startsWith('more:')){let wid=a.slice(5),w=data.collections.flatMap(c=>c.lists.flatMap(l=>l.words)).find(x=>x.id===wid);if(!w)return;let action=prompt(`Was möchtest du mit „${w.term}“ machen?\n1 = Als gelernt markieren/Markierung entfernen\n2 = In andere Liste kopieren\n3 = In andere Liste verschieben\n4 = Punkte zurücksetzen`);if(action==='1')w.mastered=!w.mastered;else if(action==='4')w.points=0;else if(action==='2'||action==='3'){let targets=data.collections.flatMap(c=>c.lists.map(l=>({c,l}))),opts=targets.map((x,i)=>`${i+1}. ${x.c.name} / ${x.l.name}`).join('\n'),n=prompt('Ziel-Liste auswählen:\n'+opts,'1');let t=targets[Number(n)-1];if(t){let copy=JSON.parse(JSON.stringify(w));copy.id=id();t.l.words.push(copy);if(action==='3'){let src=data.collections.find(c=>c.id===w.collectionId)?.lists.find(l=>l.id===w.listId);if(src)src.words=src.words.filter(x=>x.id!==wid)}}}save();render()}
 else if(a.startsWith('choice:')){let parts=a.split(':'),choice=decodeURIComponent(parts[1]),w=quiz.words[quiz.index],correct=quiz.direction==='forward'?(w.translations||[w.translation])[0]:w.term,ok=choice.toLocaleLowerCase()===correct.toLocaleLowerCase();if(ok){applyGrade(w,true);quiz.correct++}else applyGrade(w,false);let fb=document.getElementById('choiceFeedback');if(fb)fb.innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'Richtig!':'Richtige Antwort: '+esc(correct)}</div><button class="primary" data-action="nextQuestion">Weiter</button>`;document.querySelectorAll('[data-action^="choice:"]').forEach(b=>b.disabled=true)}
 else if(a.startsWith('practice:')){let wid=a.slice(9),w=data.collections.flatMap(c=>c.lists.flatMap(l=>l.words)).find(x=>x.id===wid);if(w){quiz={words:[w],index:0,correct:0,limit:1,mode:'type',direction:'forward'};tab='learn';renderQuiz()}}
}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)handleAction(b.dataset.action)});document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;quiz=null;render()}));
document.addEventListener('change',e=>{if(e.target.id==='pickCollection'){data.activeCollection=e.target.value;let c=getC();data.activeList=c.lists[0]?.id;save();render()}if(e.target.id==='pickList'){data.activeList=e.target.value;save();render()}if(e.target.id==='sortPick'){getC().settings.sort=e.target.value;save();render()}if(e.target.id==='quizCollection'){let c=data.collections.find(x=>x.id===e.target.value);data.activeCollection=c.id;data.activeList=c.lists[0]?.id;save();learnPage()} });
document.addEventListener('input',e=>{if(e.target.id==='wordSearch'){let s=e.target.value.toLowerCase();document.querySelectorAll('.word-card').forEach(el=>el.classList.toggle('hidden',!el.dataset.search.includes(s)))}});
window.addEventListener('beforeunload',save);if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body></html>
